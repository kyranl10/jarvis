<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#04080d">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Jarvis HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column HUD. Arc reactor + clock up top, then stacked telemetry panels. Single dark theme by design. */
:root {
  --void: #04080d;
  --panel: rgba(20, 60, 80, 0.18);
  --line: rgba(111, 227, 255, 0.22);
  --arc: #6fe3ff;
  --arc-dim: #4a9bb3;
  --text: #d7f6ff;
  --muted: #7fa8b6;
  --gold: #ffbf4d;
  --alert: #ff6b5b;
  --display: "Rajdhani", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--void); }
body {
  background: var(--void)
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(111, 227, 255, 0.12), transparent 60%);
  color: var(--text);
  font-family: var(--display);
  font-size: 17px;
  min-height: 100vh;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }

/* Arc reactor */
.core { display: grid; place-items: center; position: relative; padding-block: 8px; }
.reactor { width: min(260px, 72vw); aspect-ratio: 1; max-width: 100%; position: relative; }
.reactor svg { width: 100%; height: 100%; overflow: visible; }
.ring { fill: none; stroke: var(--arc); }
.spin { transform-origin: 130px 130px; animation: spin 40s linear infinite; }
.spin.rev { animation-duration: 26s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.clock {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px;
}
.clock .time {
  font-size: clamp(44px, 13vw, 58px); font-weight: 600; letter-spacing: 0.04em; line-height: 1;
  font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(111, 227, 255, 0.55);
}
.clock .date { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; color: var(--arc-dim); text-transform: uppercase; }

.greet { text-align: center; display: grid; gap: 6px; }
.greet h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: 0.02em; text-wrap: balance; }
.greet p { margin: 0; color: var(--muted); font-size: 16px; text-wrap: balance; }

.speak {
  justify-self: center; display: inline-flex; align-items: center; gap: 10px;
  font: 600 14px var(--display); letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--arc); background: transparent; border: 1px solid var(--line);
  padding: 10px 20px; border-radius: 999px; cursor: pointer;
}
.speak:hover, .speak:focus-visible { border-color: var(--arc); box-shadow: 0 0 16px rgba(111, 227, 255, 0.35); outline: none; }
.speak .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--arc); box-shadow: 0 0 10px var(--arc); }
.speak[aria-pressed="true"] .dot { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* Panels */
.panel {
  border: 1px solid var(--line); background: var(--panel);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  padding: 14px 16px 16px; display: grid; gap: 10px;
}
.panel h2 {
  margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--arc);
}
.panel h2 small { font-family: var(--mono); font-weight: 400; letter-spacing: 0.06em; color: var(--muted); font-size: 11px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: baseline; }
.row .k { font-family: var(--mono); font-size: 13px; color: var(--arc-dim); font-variant-numeric: tabular-nums; }
.row .v { min-width: 0; font-size: 17px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.row .v span { display: block; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); font-size: 15px; }

.row.due .k { color: var(--gold); }
.row.due.hot .k { color: var(--alert); }
.res-W { color: var(--arc); } .res-L { color: var(--alert); } .res-D { color: var(--muted); }
.tminus { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 1px 6px; border: 1px solid currentColor; margin-left: 8px; vertical-align: 2px; }

.env { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.env div { display: grid; gap: 2px; }
.env b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.env i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 380px) { .env { grid-template-columns: repeat(2, 1fr); } }

.foot { text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.foot.warn { color: var(--gold); }

@media (prefers-reduced-motion: reduce) { .spin, .speak .dot { animation: none !important; } }
</style>

<main class="wrap">
  <section class="core" aria-label="Clock">
    <div class="reactor">
      <svg viewBox="0 0 260 260" aria-hidden="true">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6fe3ff" stop-opacity="0.22"/>
            <stop offset="70%" stop-color="#6fe3ff" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#6fe3ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="130" cy="130" r="128" fill="url(#glow)"/>
        <g class="spin"><circle class="ring" cx="130" cy="130" r="118" stroke-width="1" stroke-dasharray="2 6" opacity="0.7"/></g>
        <g class="spin rev"><circle class="ring" cx="130" cy="130" r="104" stroke-width="5" stroke-dasharray="54 14" opacity="0.5"/></g>
        <circle class="ring" cx="130" cy="130" r="92" stroke-width="1" opacity="0.4"/>
        <g class="spin"><circle class="ring" cx="130" cy="130" r="84" stroke-width="2" stroke-dasharray="120 40 20 40" opacity="0.8"/></g>
      </svg>
      <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    </div>
  </section>

  <section class="greet">
    <h1 id="greeting">Good morning, sir.</h1>
    <p id="summary">Bringing systems online.</p>
  </section>

  <button class="speak" id="speak" type="button" aria-pressed="false"><span class="dot"></span><span id="speak-label">Brief me</span></button>

  <section class="panel" aria-labelledby="h-env">
    <h2 id="h-env">Environment <small id="env-sky"></small></h2>
    <div class="env" id="env"></div>
  </section>

  <section class="panel" aria-labelledby="h-today">
    <h2 id="h-today">Today <small id="today-count"></small></h2>
    <ul class="rows" id="today"></ul>
  </section>

  <section class="panel" aria-labelledby="h-due">
    <h2 id="h-due">Due <small>Canvas · next 7 days</small></h2>
    <ul class="rows" id="due"></ul>
  </section>

  <section class="panel" aria-labelledby="h-night">
    <h2 id="h-night">Overnight <small id="night-count"></small></h2>
    <ul class="rows" id="night"></ul>
  </section>

  <section class="panel" aria-labelledby="h-pma">
    <h2 id="h-pma">PMA <small>announcements</small></h2>
    <ul class="rows" id="pma"></ul>
  </section>

  <section class="panel" aria-labelledby="h-ahead">
    <h2 id="h-ahead">Ahead <small>next 3 days</small></h2>
    <ul class="rows" id="ahead"></ul>
  </section>

  <section class="panel" aria-labelledby="h-scores">
    <h2 id="h-scores">Scores <small>last 3 days</small></h2>
    <ul class="rows" id="scores"></ul>
  </section>

  <section class="panel" aria-labelledby="h-games">
    <h2 id="h-games">Upcoming games <small>next 3 days</small></h2>
    <ul class="rows" id="games"></ul>
  </section>

  <p class="foot" id="foot"></p>
</main>

<script>
const hoursFromNow = (h) => new Date(Math.round(Date.now() / 3600e3 + h) * 3600e3).toISOString();
const DEMO = {
  generated: null, demo: true, address: "sir",
  weather: { temp: 58, sky: "overcast", high: 86, low: 55, rain: 0 },
  today: [{ time: "4 PM", end: "4:30 PM", title: "Project Meeting", place: "online" }],
  ahead: [
    { day: "Tomorrow", time: "All day", end: "", title: "Fall Break", place: "" },
    { day: "Fri", time: "8 AM", end: "8:30 AM", title: "Fall Break", place: "" },
    { day: "Sat", time: "All day", end: "", title: "Game Day", place: "" }
  ],
  due: [
    { day: "Sun", days: 4, title: "Problem Set 4", course: "MATH 101", time: "11:59 PM" },
    { day: "Mon", days: 5, title: "Essay Draft", course: "ENGL 105", time: "11:59 PM" }
  ],
  overnight: {
    comments: [{ who: "Sam Lee", where: "Drum Group", said: "Watch the accents in bar 12" }],
    dms: 1, dm_from: ["jordan.k"],
    emails: [{ from: "Prof. Rivera", subject: "Office hours moved", snippet: "Thursday office hours are in Hamilton 425 this week." }], more_emails: 0
  },
  pma: [{ when: "Today 9:15 AM", text: "Chapter tonight at 9:00 in the usual room", new: true }],
  sports: {
    scores: [
      { at: hoursFromNow(-10), comp: "MLS", us: "Charlotte FC", them: "Orlando City SC", home: true, score: [2, 1], res: "W" },
      { at: hoursFromNow(-40), comp: "Bundesliga", us: "Dortmund", them: "Werder Bremen", home: true, score: [1, 1], res: "D" }
    ],
    upcoming: [
      { at: hoursFromNow(9), comp: "NBA", us: "the Hornets", them: "Boston Celtics", home: false, rec: ["2-1", "3-0"], tv: "ESPN" },
      { at: hoursFromNow(50), comp: "Copa Argentina", us: "Boca Juniors", them: "Racing Club", home: null, rec: ["", ""], tv: "" }
    ]
  },
  voice: "Good morning, sir. It's Wednesday the 14th. It's currently 58 degrees and overcast, with a high of 86. You have one engagement today: Project Meeting at 4 PM. Problem Set 4 for MATH 101 is due on Sunday, and 1 more this week. Tomorrow, Fall Break. Shall I leave you to it?"
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tick() {
  const now = new Date();
  $("time").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/i, "");
  $("date").textContent = now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}

function greeting(name) {
  const h = new Date().getHours();
  const part = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  return `${part}, ${name}.`;
}

function rows(el, items, render, emptyText) {
  el.innerHTML = items.length ? items.map(render).join("") : `<li class="empty">${esc(emptyText)}</li>`;
}

function render(d) {
  $("greeting").textContent = greeting(d.address || "sir");
  const n = d.today.length, dueSoon = d.due.filter((a) => a.days <= 1).length;
  $("summary").textContent =
    (n ? `${n} engagement${n > 1 ? "s" : ""} today` : "Your schedule is clear today") +
    (d.due.length ? ` · ${d.due.length} assignment${d.due.length > 1 ? "s" : ""} due this week` : "") +
    (dueSoon ? ` · ${dueSoon} due within a day` : "") + ".";

  const w = d.weather;
  $("env-sky").textContent = w ? w.sky : "offline";
  $("env").innerHTML = w
    ? [["Now", w.temp + "°"], ["High", w.high + "°"], ["Low", w.low + "°"], ["Rain", w.rain + "%"]]
        .map(([k, v]) => `<div><b>${esc(v)}</b><i>${esc(k)}</i></div>`).join("")
    : `<p class="empty">Weather sensors unavailable.</p>`;

  $("today-count").textContent = n ? `${n} item${n > 1 ? "s" : ""}` : "";
  rows($("today"), d.today, (e) =>
    `<li class="row"><span class="k">${esc(e.time)}</span><span class="v">${esc(e.title)}${
      e.place || e.end ? `<span>${esc([e.end && "until " + e.end, e.place].filter(Boolean).join(" · "))}</span>` : ""}</span></li>`,
    "Nothing scheduled.");

  rows($("due"), d.due, (a) =>
    `<li class="row due${a.days <= 1 ? " hot" : ""}"><span class="k">${esc(a.day)}</span><span class="v">${esc(a.title)}<span>${
      esc([a.course, a.time].filter(Boolean).join(" · "))}<em class="tminus">T-${esc(a.days)}d</em></span></span></li>`,
    "Nothing due. Well done, sir.");

  const o = d.overnight || { comments: [], dms: 0, dm_from: [], emails: [], more_emails: 0 };
  const night = [
    ...o.comments.map((c) => ({ k: "FB", t: `${c.who} · ${c.where}`, s: c.said })),
    ...(o.dms ? [{ k: "IG", t: `${o.dms} message${o.dms > 1 ? "s" : ""}`, s: (o.dm_from || []).join(", ") }] : []),
    ...(o.emails || []).map((e) => ({ k: "Mail", t: e.subject, s: [e.from, e.snippet].filter(Boolean).join(" · ") })),
    ...(o.more_emails ? [{ k: "Mail", t: `+ ${o.more_emails} more`, s: "" }] : [])
  ];
  $("night-count").textContent = "since 10:30 PM";
  rows($("night"), night, (i) =>
    `<li class="row"><span class="k">${esc(i.k)}</span><span class="v">${esc(i.t)}${
      i.s ? `<span>${esc(i.s)}</span>` : ""}</span></li>`,
    "Quiet night, sir.");

  rows($("pma"), d.pma || [], (p) =>
    `<li class="row"><span class="k">${esc(p.when.replace(/ .*/, ""))}</span><span class="v">${esc(p.text)}<span>${
      esc(p.when.replace(/^\S+ /, ""))}</span></span></li>`,
    "No announcements in the last 3 days.");

  rows($("ahead"), d.ahead, (e) =>
    `<li class="row"><span class="k">${esc(e.day)}</span><span class="v">${esc(e.title)}<span>${
      esc([e.time, e.place].filter(Boolean).join(" · "))}</span></span></li>`,
    "Clear skies ahead.");

  const games = sportsWithin(d, 72);
  rows($("scores"), games.scores, (g) =>
    `<li class="row"><span class="k">${esc(dayName(g.at))}</span><span class="v">${esc(`${cap(g.us)} ${g.score[0]}–${g.score[1]} ${g.them}`)}<em class="tminus res-${esc(g.res)}">${esc(g.res)}</em><span>${
      esc(g.comp)}</span></span></li>`,
    "No games in the last 3 days.");
  rows($("games"), games.upcoming, (g) =>
    `<li class="row"><span class="k">${esc(dayName(g.at))}</span><span class="v">${esc(matchup(g))}<span>${
      esc([clock(g.at), g.comp, g.tv].filter(Boolean).join(" · "))}</span></span></li>`,
    "No games in the next 3 days.");

  const foot = $("foot");
  if (d.demo) {
    foot.textContent = "Demo data · open with your topic link to go live";
    foot.className = "foot warn";
  } else {
    const t = new Date(d.generated);
    foot.textContent = "Last sync " + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    foot.className = "foot" + (Date.now() - t > 5 * 3600e3 ? " warn" : "");
  }
  window.__voice = d.voice;
  window.__data = d;
}

const DAYS = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };
const joinAnd = (a) => a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function ordinal(n) {
  return n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
}

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const clock = (at) => new Date(at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(":00", "");
const dayDiff = (at) => Math.round((new Date(new Date(at).toDateString()) - new Date(new Date().toDateString())) / 864e5);
function dayName(at) {
  const n = dayDiff(at);
  return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : new Date(at).toLocaleDateString("en-US", { weekday: "short" });
}
function matchup(g) {
  const side = (name, rec) => name + (rec ? ` (${rec})` : "");
  return `${side(cap(g.us), g.rec[0])} ${g.home === false ? "at" : "vs"} ${side(g.them, g.rec[1])}`;
}
// Games from the last and next `hours`, judged against the clock right now
function sportsWithin(d, hours) {
  const s = d.sports || { scores: [], upcoming: [] }, now = Date.now(), edge = hours * 3600e3;
  return {
    scores: s.scores.filter((g) => new Date(g.at) >= now - edge && new Date(g.at) <= now),
    upcoming: s.upcoming.filter((g) => new Date(g.at) >= now && new Date(g.at) <= now + edge)
  };
}
// Mirrors spoken_sports in style.py: one sentence for results, one for what's coming up
function sportsSpeech(d) {
  const { scores, upcoming } = sportsWithin(d, 24);
  const names = (g) => g.say || [g.us, g.them];
  const result = (g) => {
    const [us, them] = names(g), [a, b] = g.score, hi = Math.max(a, b), lo = Math.min(a, b);
    return g.res === "D" ? `${us} drew ${a || "nil"} all with ${them}`
         : g.res === "W" ? `${us} beat ${them} ${hi} to ${lo}` : `${us} lost ${hi} to ${lo} to ${them}`;
  };
  const when = new Map();  // today / tonight / tomorrow -> time -> games
  for (const g of upcoming) {
    const n = dayDiff(g.at), hour = new Date(g.at).getHours();
    const day = n === 0 ? (hour >= 17 ? "tonight" : "today") : n === 1 ? "tomorrow"
              : "on " + new Date(g.at).toLocaleDateString("en-US", { weekday: "long" });
    const t = hour < 12 ? clock(g.at) : clock(g.at).replace(" PM", ""), [us, them] = names(g);
    if (!when.has(day)) when.set(day, new Map());
    const times = when.get(day);
    if (!times.has(t)) times.set(t, []);
    times.get(t).push(`${us} play ${them}`);
  }
  const parts = [...when].map(([day, times], i) => `${day}${i ? "" : ","} ` + joinAnd([...times].map(([t, games]) =>
    games.length === 1 ? `${games[0]} at ${t}` : `${joinAnd(games)}, ${games.length === 2 ? "both" : "all"} at ${t}`)));
  const ahead = parts.length <= 1 ? parts.join("") : parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
  const results = joinAnd(scores.slice().reverse().map(result));
  if (!results) return ahead ? `In sports, ${ahead}.` : "";
  return `In sports, ${results}.` + (ahead ? ` ${cap(ahead)}.` : "");
}

// "Avi Thaker wrote about Project kickoff: Great chatting with you all today." Same as style.spoken_email
const within = (part, whole) => {
  const words = (t) => ` ${(t.toLowerCase().match(/[\p{L}\p{N}_]+/gu) || []).join(" ")} `;
  return words(whole).includes(words(part));
};
function emailSpeech(e) {
  const topic = e.subject === "(no subject)" ? "" : e.subject;
  let said = (e.snippet || "").replace(/…$/, "").trim();
  if (said && !/[.!?]$/.test(said)) said += ".";
  if (!said) return topic ? `${e.from} wrote about ${topic}.` : `${e.from} sent an email.`;
  if (topic && within(said, topic)) return `${e.from} wrote about ${topic}.`;
  if (!topic || within(topic, said)) return `${e.from} wrote: ${said}`;
  return `${e.from} wrote about ${topic}: ${said}`;
}

// Built at the moment you tap, so the greeting, the time and what's left today are always current
function buildSpeech(d) {
  const now = new Date(), name = d.address || "sir";
  const open = `${greeting(name)} It's ${now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}.`;
  const fresh = !d.demo && d.date === now.toLocaleDateString("en-CA") && d.today.every((e) => "start_at" in e);
  if (!fresh) return `${open} ${d.voice}`;

  const parts = [open, `Today is ${now.toLocaleDateString("en-US", { weekday: "long" })} the ${ordinal(now.getDate())}.`];
  const w = d.weather;
  if (w) parts.push(`It's currently ${w.temp} degrees and ${w.sky}, with a high of ${w.high}.` +
                    (w.rain >= 50 ? " You may want an umbrella." : ""));

  const left = d.today.filter((e) => e.all_day || new Date(e.start_at) > now);
  const say = (e) => e.all_day ? e.title : `${e.title} at ${e.time}`;
  if (!d.today.length) parts.push("Your schedule is clear today.");
  else if (!left.length) parts.push("That's everything on today's schedule.");
  else parts.push(`You have ${left.length === 1 ? "one engagement" : left.length + " engagements"}` +
                  `${left.length < d.today.length ? " remaining" : ""} today: ${joinAnd(left.map(say))}.`);

  if (d.due.length) {
    const a = d.due[0];
    const due = new Date(now.getTime() + a.days * 864e5).toLocaleDateString("en-US", { weekday: "long" });
    const when = a.days === 0 ? "today" : a.days === 1 ? "tomorrow" : `on ${due}`;
    const more = d.due.length > 1 ? `, and ${d.due.length - 1} more this week` : "";
    parts.push(`${a.title}${a.course ? " for " + a.course : ""} is due ${when}${more}.`);
  }

  const o = d.overnight;
  if (o && now.getHours() < 12) {
    const bits = [];
    if (o.comments.length) {
      const c = o.comments[0];
      bits.push(`${plural(o.comments.length, "new comment")} in ${c.where}. ${c.said ? `${c.who} says: ${c.said}` : `The first from ${c.who}`}`);
    }
    if (o.dms) bits.push(`${plural(o.dms, "Instagram message")}${o.dm_from.length ? " from " + joinAnd(o.dm_from) : ""}`);
    const mail = (o.emails || []).slice(-3).reverse().map(emailSpeech);  // newest first
    const more = (o.emails || []).length + (o.more_emails || 0) - mail.length;
    if (more) mail.push(`And ${plural(more, "more email")}.`);
    if (bits.length) parts.push(`Overnight, ${bits.join(", and ")}.`, ...mail);
    else if (mail.length) parts.push(`Overnight, ${mail.join(" ")}`);
  }

  const news = (d.pma || []).filter((p) => p.new);
  if (news.length && now.getHours() < 12) {
    const text = news[0].text.replace(/…$/, "");
    parts.push(`From PMA: ${text}${/[.!?]$/.test(text) ? "" : "."}`);
  }

  if (d.ahead.length) {
    const e = d.ahead[0];
    parts.push(`${e.day === "Tomorrow" ? "Tomorrow" : "On " + (DAYS[e.day] || e.day)}, ${e.time === "All day" ? e.title : `${e.title} at ${e.time}`}.`);
  }
  const sports = sportsSpeech(d);
  if (sports) parts.push(sports);
  parts.push(left.length || d.due.length ? "Shall I leave you to it?" : `Enjoy the rest of the day, ${name}.`);
  return parts.join(" ");
}

function speak() {
  const btn = $("speak");
  if (!("speechSynthesis" in window) || !window.__voice) { $("speak-label").textContent = "Voice unavailable"; return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(buildSpeech(window.__data));
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find((v) => /Arthur/i.test(v.name)) || voices.find((v) => /Daniel|Google UK English Male/i.test(v.name))
         || voices.find((v) => v.lang === "en-GB") || null;
  u.lang = "en-GB"; u.rate = 1.0; u.pitch = 0.95;
  u.onstart = () => { btn.setAttribute("aria-pressed", "true"); $("speak-label").textContent = "Stop"; };
  u.onend = u.onerror = () => { btn.setAttribute("aria-pressed", "false"); $("speak-label").textContent = "Brief me"; };
  speechSynthesis.speak(u);
}

async function load() {
  const topic = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]+$/.test(topic)) return render(DEMO);
  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=24h`, { cache: "no-store" });
    const lines = (await res.text()).trim().split("\n").filter(Boolean);
    const msgs = lines.map((l) => JSON.parse(l)).filter((m) => m.event === "message");
    if (!msgs.length) throw new Error("no data yet");
    render(JSON.parse(msgs[msgs.length - 1].message));
  } catch (e) {
    render(DEMO);
    $("foot").textContent = "Couldn't reach Jarvis's data, showing demo";
  }
}

$("speak").addEventListener("click", speak);
if ("speechSynthesis" in window) speechSynthesis.getVoices();
tick(); setInterval(tick, 10000);
load(); setInterval(load, 15 * 60000);
</script>

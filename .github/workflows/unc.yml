name: UNC board

on:
  schedule:
    - cron: "23 */2 * * *"  # GitHub often starts these late; the internship scan only needs it every few hours
  workflow_dispatch:

permissions:
  contents: write  # commits data/unc.json when the board's data internships change

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python -m jarvis.unc_board
      - name: Commit if the rows changed
        run: |
          git diff --quiet data/unc.json && exit 0
          git config user.name "jarvis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unc.json
          git commit -m "UNC board update"
          git pull --rebase -q origin master && git push -q origin HEAD:master
